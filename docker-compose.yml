services:
  ecopower-calculator:
    build: .
    container_name: ecopower-tariffs
    env_file:
      - .env
    environment:
      - TARGET_MONTH=previous
    network_mode: host
    restart: no

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ecopower-tariffs-api
    env_file:
      - .env
    ports:
      - "8001:8000"  # host 8000 is already taken by automower-frontend
    restart: unless-stopped
